name: Supabase Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: |
          echo "Supabase CLI version"
          supabase --version

      - name: Link Supabase project
        run: |
          echo "Linking project ref: ${SUPABASE_PROJECT_REF}"
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Push database migrations
        run: |
          echo "Pushing database migrations..."
          supabase db push --yes
          echo "Migrations pushed successfully."

      - name: Deploy accounting_api function
        run: |
          echo "Deploying accounting_api..."
          supabase functions deploy accounting_api --no-verify-jwt
          echo "accounting_api deployed."

      - name: Deploy verify_pin function
        run: |
          echo "Deploying verify_pin..."
          supabase functions deploy verify_pin --no-verify-jwt
          echo "verify_pin deployed."
